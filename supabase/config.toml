# Meta no manda el JWT de Supabase: el webhook se autentica con la firma
# X-Hub-Signature-256 (ver graph.ts), no con verify_jwt.
[functions.whatsapp-webhook]
verify_jwt = false

# El robot horario llega desde pg_cron con la cabecera x-cron-key, no con
# JWT; un admin puede lanzarlo a mano con su sesion y la funcion lo valida
# por dentro (has_role). Sin una de las dos cosas responde 401.
[functions.recuperar-pagos]
verify_jwt = false

# Mismo modelo que recuperar-pagos: el robot horario llega desde pg_cron con
# x-cron-key (clave_cron_valida) y el boton del panel con la sesion del admin
# u organizador (has_role / organizer_id, validado dentro). Sin ninguna de
# las dos responde 401/403 antes de tocar RockTheSport. Asi esta desplegada
# (comprobado el 10-oct-2026): lo escrito coincide con lo desplegado.
[functions.rockthesport-sync]
verify_jwt = false

# El cedente sin cuenta pide su enlace por email: no hay sesion que valga.
# La funcion nunca devuelve el enlace en la respuesta, solo lo manda al correo.
[functions.cesion-solicitar-enlace]
verify_jwt = false

# Accion masiva del panel: solo con sesion. Ademas la funcion comprueba que
# quien llama es admin u organizador de todas las carreras afectadas.
[functions.reenviar-comprobantes]
verify_jwt = true

# Consulta de inscripcion desde la web de la carrera: el corredor no tiene
# sesion. La funcion exige documento + (email o fecha de nacimiento), limita
# intentos y la copia solo va al email de la inscripcion.
[functions.consultar-inscripcion]
verify_jwt = false

# Lee el cartel o el reglamento para el asistente de creacion de carrera.
# Solo con sesion; dentro comprueba admin u organizador (has_role).
[functions.leer-carrera]
verify_jwt = true

# Devoluciones Redsys desde el panel: solo con sesion. Ademas la funcion
# comprueba que quien llama es admin (el dinero sale del TPV de UNO).
[functions.redsys-devolucion]
verify_jwt = true

[functions.verificar-dominio]
verify_jwt = true

# Publica en el Instagram de Camberas desde el panel: solo con sesion, y
# dentro comprueba que quien llama es admin (has_role). Ver
# docs/instagram-alta-meta.md.
[functions.instagram-publicar]
verify_jwt = true

# Instagram del club en su web propia: la llama la plantilla sin sesion (y
# desde dominios propios). Solo acepta el slug de una carrera, no un @ suelto,
# y guarda caché de 1 h. Ver docs/instagram-alta-meta.md.
[functions.instagram-feed]
verify_jwt = false

# Historias en directo: el robot de cada minuto llega desde pg_cron con
# x-cron-key (clave_cron_valida), no con JWT; el panel llega con la sesion del
# admin (has_role, validado dentro). Sin una de las dos responde 401/403.
[functions.instagram-directo]
verify_jwt = false

# Meta no manda el JWT de Supabase: el webhook de mensajes directos se
# autentica con la firma X-Hub-Signature-256 (_shared/meta.ts), como el de
# WhatsApp.
[functions.instagram-webhook]
verify_jwt = false
